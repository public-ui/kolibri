name: Upload Reports
inputs:
  name:
    default: 'reports'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: |
          packages/**/playwright-report/
          packages/**/test-results/**/*.png

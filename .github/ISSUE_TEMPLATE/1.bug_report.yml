name: Report a bug
description: All relevant bugs, e.g. faulty components or examples
title: '🐞 Bug: '
labels: ['v2', 'v3']
type: Bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is, and what you expected to happen.
      placeholder: I expected A to happen, but I observed B instead
    validations:
      required: true
  - type: input
    id: reprod-url
    attributes:
      label: 'Reproduction URL'
      description: |
        Please enter your URL to provide a reproduction of the issue.

        StackBlitz starter templates:
        - **KoliBri (v2)** <https://stackblitz.com/edit/vitejs-vite-kkfhk5>
      placeholder: ex. https://stackblitz.com/edit/XXXXXX
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction steps
      description: |
        **List the precise reproductions steps**: The easier it is for us to run your reproduction, the faster we can fix the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 'Screenshots'
      description: If applicable, add screenshots to help explain your problem.
      placeholder: Paste your screenshots here
    validations:
      required: false
  - type: markdown
    attributes:
      value: '## Additional information'
  - type: dropdown
    id: affected_components
    attributes:
      label: Components
      description: Select all components that are affected by the problem.
      multiple: true
      options:
        - 'Abbr'
        - 'Accordion'
        - 'Alert'
        - 'Avatar'
        - 'Badge'
        - 'Breadcrumb'
        - 'Button-Link'
        - 'Button'
        - 'Card'
        - 'Combobox'
        - 'Details'
        - 'Form'
        - 'Heading'
        - 'Icon'
        - 'Image'
        - 'Input-Checkbox'
        - 'Input-Color'
        - 'Input-Date'
        - 'Input-Email'
        - 'Input-File'
        - 'Input-Number'
        - 'Input-Password'
        - 'Input-Radio'
        - 'Input-Range'
        - 'Input-Text'
        - 'Link-Button'
        - 'Link'
        - 'Modal'
        - 'Nav'
        - 'Pagination'
        - 'Progress'
        - 'Quote'
        - 'Select'
        - 'Spin'
        - 'Split-Button'
        - 'Table'
        - 'Tabs'
        - 'Textarea'
        - 'Toast'
        - 'Toolbar'
        - 'Tree'
        - 'Version'
    validations:
      required: false
  - type: dropdown
    id: browsers
    attributes:
      label: Browsers
      description: What browsers are you seeing the problem on?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Microsoft Edge

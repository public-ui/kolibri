name: Size Analysis

# Analyses the artifact size of @public-ui/components and @public-ui/theme-default on demand:
# treemap, hotspots, duplicated modules, CSS repeated across sheets and restructuring candidates.
# Started manually only (Actions → Size Analysis → Run workflow, choose the branch). The size gate of
# every pull request runs in ci.yml; see docs/SIZE_GATE.md.

on:
  workflow_dispatch:

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Build with source maps
        run: pnpm --filter "@public-ui/theme-default..." build
        env:
          KOLIBRI_SOURCE_MAP: 'true'
      - name: Analyse
        run: pnpm --filter @public-ui/components --filter @public-ui/theme-default size:analyze
      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: size-analysis
          path: |
            packages/components/size-report/
            packages/themes/default/size-report/
          if-no-files-found: ignore
          retention-days: 14

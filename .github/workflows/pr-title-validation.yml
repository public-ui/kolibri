name: PR Title Validation

on:
  pull_request:
    # `synchronize` is required: check runs are attached to a head SHA. Without it,
    # every push creates a new SHA for which this required check never reports and the
    # PR stays stuck on "Expected — Waiting for status to be reported".
    types: [opened, edited, reopened, synchronize]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Configure the types allowed in PR titles
          # Based on Conventional Commits specification
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Require a scope (optional - can be removed if not needed)
          requireScope: false
          # Subject must start with lowercase
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with a lowercase letter.

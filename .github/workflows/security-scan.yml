name: Security Scan

on:
  pull_request:
    branches:
      - 'develop'
      - 'release/*'
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      enable_audit:
        description: 'Run pnpm audit'
        type: boolean
        default: true
      enable_trivy:
        description: 'Run the Trivy scan'
        type: boolean
        default: true
      enable_clamav:
        description: 'Run the ClamAV scan'
        type: boolean
        default: true
      install_deps:
        description: 'Install dependencies'
        type: boolean
        default: false

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  scheduled-scan:
    name: Scheduled Security Scan (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix:
        branch:
          - develop
          - 'release/2'
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ matrix.branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Run pnpm audit
        id: pnpm_audit
        continue-on-error: true
        run: pnpm audit --audit-level moderate
        shell: bash

      - name: Scan repository with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'

      - name: Scan repository with ClamAV
        id: clamav
        continue-on-error: true
        uses: djdefi/gitavscan@main

      - name: Summarize scan results
        if: always()
        env:
          PNPM_AUDIT_OUTCOME: ${{ steps.pnpm_audit.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          CLAMAV_OUTCOME: ${{ steps.clamav.outcome }}
        run: |
          printf '| Step | Outcome |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| pnpm audit | %s |\n' "$PNPM_AUDIT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf '| Trivy | %s |\n' "$TRIVY_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf '| ClamAV | %s |\n' "$CLAMAV_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PNPM_AUDIT_OUTCOME" != 'success' || \
                "$TRIVY_OUTCOME" != 'success' || \
                "$CLAMAV_OUTCOME" != 'success' ]]; then
            echo 'One or more security scans reported a problem.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        shell: bash

  targeted-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: inputs.install_deps
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Run pnpm audit
        id: pnpm_audit
        if: inputs.enable_audit
        continue-on-error: true
        run: pnpm audit --audit-level moderate
        shell: bash

      - name: Scan repository with Trivy
        id: trivy
        if: inputs.enable_trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'

      - name: Scan repository with ClamAV
        id: clamav
        if: inputs.enable_clamav
        continue-on-error: true
        uses: djdefi/gitavscan@main

      - name: Summarize scan results
        if: always()
        env:
          PNPM_AUDIT_OUTCOME: ${{ steps.pnpm_audit.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          CLAMAV_OUTCOME: ${{ steps.clamav.outcome }}
          RUN_PNPM_AUDIT: ${{ inputs.enable_audit }}
          RUN_TRIVY: ${{ inputs.enable_trivy }}
          RUN_CLAMAV: ${{ inputs.enable_clamav }}
        run: |
          printf '| Step | Outcome |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"

          pnpm_audit_outcome="$PNPM_AUDIT_OUTCOME"
          if [[ "$RUN_PNPM_AUDIT" != 'true' ]]; then
            pnpm_audit_outcome='skipped'
          fi
          printf '| pnpm audit | %s |\n' "$pnpm_audit_outcome" >> "$GITHUB_STEP_SUMMARY"

          trivy_outcome="$TRIVY_OUTCOME"
          if [[ "$RUN_TRIVY" != 'true' ]]; then
            trivy_outcome='skipped'
          fi
          printf '| Trivy | %s |\n' "$trivy_outcome" >> "$GITHUB_STEP_SUMMARY"

          clamav_outcome="$CLAMAV_OUTCOME"
          if [[ "$RUN_CLAMAV" != 'true' ]]; then
            clamav_outcome='skipped'
          fi
          printf '| ClamAV | %s |\n' "$clamav_outcome" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$pnpm_audit_outcome" != 'success' && "$pnpm_audit_outcome" != 'skipped' || \
                "$trivy_outcome" != 'success' && "$trivy_outcome" != 'skipped' || \
                "$clamav_outcome" != 'success' && "$clamav_outcome" != 'skipped' ]]; then
            echo 'One or more security scans reported a problem.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        shell: bash

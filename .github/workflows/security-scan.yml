name: Security Scan

on:
  pull_request:
    branches:
      - 'develop'
      - 'release/*'
  push:
    branches:
      - 'develop'
      - 'release/*'
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      enable_audit:
        description: 'Run pnpm audit'
        type: boolean
        default: true
      enable_trivy:
        description: 'Run the Trivy scan'
        type: boolean
        default: true
      enable_clamav:
        description: 'Run the ClamAV scan'
        type: boolean
        default: false

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  clamav-and-trivy:
    name: ClamAV and Trivy Scan
    strategy:
      fail-fast: false
      matrix:
        branch:
          - develop
          - 'release/2'
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Check if branch should be scanned
        id: check_branch
        run: |
          should_run="false"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            should_run="true"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "${{ matrix.branch }}" ]]; then
            should_run="true"
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "${{ matrix.branch }}" ]]; then
            should_run="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref_name }}" == "${{ matrix.branch }}" ]]; then
            should_run="true"
          fi

          echo "should_run=$should_run" >> $GITHUB_OUTPUT
          echo "Branch ${{ matrix.branch }}: should_run=$should_run"
        shell: bash

      - name: Checkout repository
        if: steps.check_branch.outputs.should_run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && matrix.branch || github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup pnpm
        if: steps.check_branch.outputs.should_run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.check_branch.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check_branch.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Run pnpm audit
        id: pnpm_audit
        if: steps.check_branch.outputs.should_run == 'true' && inputs.enable_audit == 'true'
        continue-on-error: true
        run: pnpm audit
        shell: bash

      - name: Scan repository with Trivy
        id: trivy
        if: steps.check_branch.outputs.should_run == 'true' && inputs.enable_trivy == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'

      - name: Scan repository with ClamAV
        id: clamav
        if: steps.check_branch.outputs.should_run == 'true' && inputs.enable_clamav == 'true'
        continue-on-error: true
        uses: djdefi/gitavscan@main

      - name: Summarize scan results
        if: always() && steps.check_branch.outputs.should_run == 'true'
        env:
          CLAMAV_OUTCOME: ${{ steps.clamav.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          PNPM_AUDIT_OUTCOME: ${{ steps.pnpm_audit.outcome }}
          RUN_CLAMAV: ${{ env.RUN_CLAMAV }}
          RUN_TRIVY: ${{ env.RUN_TRIVY }}
          RUN_PNPM_AUDIT: ${{ env.RUN_PNPM_AUDIT }}
        run: |
          printf '| Step | Outcome |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"

          pnpm_audit_outcome="$PNPM_AUDIT_OUTCOME"
          if [[ "$RUN_PNPM_AUDIT" != 'true' ]]; then
            pnpm_audit_outcome='skipped'
          fi
          printf '| pnpm audit | %s |\n' "$pnpm_audit_outcome" >> "$GITHUB_STEP_SUMMARY"

          trivy_outcome="$TRIVY_OUTCOME"
          if [[ "$RUN_TRIVY" != 'true' ]]; then
            trivy_outcome='skipped'
          fi
          printf '| Trivy | %s |\n' "$trivy_outcome" >> "$GITHUB_STEP_SUMMARY"

          clamav_outcome="$CLAMAV_OUTCOME"
          if [[ "$RUN_CLAMAV" != 'true' ]]; then
            clamav_outcome='skipped'
          fi
          printf '| ClamAV | %s |\n' "$clamav_outcome" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$pnpm_audit_outcome" != 'success' && "$pnpm_audit_outcome" != 'skipped' || \
                "$trivy_outcome" != 'success' && "$trivy_outcome" != 'skipped' || \
                "$clamav_outcome" != 'success' && "$clamav_outcome" != 'skipped' ]]; then
            echo 'One or more security scans reported a problem.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        shell: bash

name: Green-Software

on:
  pull_request:
  push:
    branches:
      - 'develop'
      - 'main'
      - 'release/*'
  workflow_dispatch:

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  energy-measurement:
    runs-on: ubuntu-latest
    steps:
      - name: Start energy measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          send-data: true
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkpoint - Checkout
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - uses: ./.github/actions/pnpm-setup

      - name: Checkpoint - Setup & Install
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'setup-and-install'
        continue-on-error: true

      - name: Build
        run: pnpm -r build

      - name: Checkpoint - Build
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'build'
        continue-on-error: true

      - name: Unit Tests
        run: pnpm -r test:unit

      - name: Checkpoint - Unit Tests
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'unit-tests'
        continue-on-error: true

      - name: Final energy measurement
        id: final-measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: final-measurement
          send-data: true
        continue-on-error: true

      - name: Energy budget check
        if: always()
        continue-on-error: true
        run: |
          ENERGY="${{ steps.final-measurement.outputs.energy-total }}"
          if [ -z "$ENERGY" ]; then
            echo "::warning::Energy measurement data not available - skipping budget check"
            exit 0
          fi
          echo "Total energy consumed: ${ENERGY}J"
          THRESHOLD=500
          OVER=$(echo "$ENERGY > $THRESHOLD" | bc -l 2>/dev/null || echo "0")
          if [ "$OVER" = "1" ]; then
            echo "::warning::Energy consumption ${ENERGY}J exceeds warning threshold of ${THRESHOLD}J"
          else
            echo "Energy consumption ${ENERGY}J is within the ${THRESHOLD}J warning threshold"
          fi

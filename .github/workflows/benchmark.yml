name: Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode'
        type: choice
        required: true
        options:
          - baseline
          - monitoring
          - pr-check
      pr-number:
        description: 'PR number (required for pr-check mode)'
        type: string
        required: false

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App Token
        if: inputs.mode != 'pr-check'
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Get GitHub App User ID
        if: inputs.mode != 'pr-check'
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ inputs.mode != 'pr-check' && steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          persist-credentials: ${{ inputs.mode == 'pr-check' }}

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install and execute benchmark
        uses: ./.github/actions/benchmark

      - name: Remove husky
        if: inputs.mode != 'pr-check'
        run: rm -rf .husky
        shell: bash

      # Baseline mode: copy result as new baseline
      - name: Copy result as new baseline
        if: inputs.mode == 'baseline'
        run: cp packages/tools/benchmark-tests/benchmark-result.json packages/tools/benchmark-tests/benchmark-baseline.json

      - name: Commit and push updated baseline
        if: inputs.mode == 'baseline'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update benchmark-baseline.json [ci skip]'
          file_pattern: 'packages/tools/benchmark-tests/benchmark-baseline.json'
          commit_user_name: '${{ steps.app-token.outputs.app-slug }}[bot]'
          commit_user_email: '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      # Monitoring mode: attest and store benchmark result
      - name: Attest benchmark result
        if: inputs.mode == 'monitoring'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: packages/tools/benchmark-tests/benchmark-result.json

      - name: Store benchmark result
        if: inputs.mode == 'monitoring'
        uses: rhysd/github-action-benchmark@v1
        with:
          alert-threshold: 10%
          auto-push: true
          fail-threshold: 25%
          gh-pages-branch: benchmarks
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file-path: packages/tools/benchmark-tests/benchmark-result.json
          tool: customSmallerIsBetter

      # PR-Check mode: compare benchmark with baseline and comment on PR
      - name: Compare benchmark with baseline
        if: inputs.mode == 'pr-check'
        run: node scripts/compare-benchmark.mjs
        working-directory: packages/tools/benchmark-tests

      - name: Find comment
        if: inputs.mode == 'pr-check'
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          body-includes: Hydration Benchmark Report
          comment-author: 'github-actions[bot]'
          issue-number: ${{ inputs.pr-number }}

      - name: Post PR Comment
        if: inputs.mode == 'pr-check'
        uses: peter-evans/create-or-update-comment@v5
        with:
          body-path: packages/tools/benchmark-tests/benchmark-report.md
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          issue-number: ${{ inputs.pr-number }}

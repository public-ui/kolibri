name: Scheduled Security Scan

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: 'JSON encoded array of branch names to scan'
        required: false
        default: '["develop", "release/2"]'

concurrency:
  group: ${{ format('workflow-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  scheduled-scan:
    name: Scheduled Security Scan (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(github.event_name == 'workflow_dispatch' && inputs.branches || '["develop", "release/2"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ matrix.branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Run security scans
        uses: ./.github/actions/security-scan
        with:
          install-deps: 'true'

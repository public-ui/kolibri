name: Sync to OpenCoDE

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4-20 * * *' # stündlich 04–20 UTC (~06–22 Uhr Berlin)

jobs:
  check-commits:
    name: Check for new commits
    if: github.repository == 'public-ui/kolibri'
    runs-on: ubuntu-latest
    outputs:
      has-new-commits: ${{ steps.check.outputs.has-new-commits }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check for new commits
        id: check
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          CURRENT=$(date +%s)
          DIFF=$((CURRENT - LAST_COMMIT))
          HOURS=$((DIFF / 3600))
          if [[ $HOURS -lt 2 ]]; then
            echo "has-new-commits=true" >> $GITHUB_OUTPUT
            echo "✅ New commit(s) within last hour"
          else
            echo "has-new-commits=false" >> $GITHUB_OUTPUT
            echo "⏭️  No new commits, skipping sync"
          fi

  sync:
    needs: check-commits
    if: |
      github.repository == 'public-ui/kolibri' &&
      (github.event_name == 'workflow_dispatch' || needs.check-commits.outputs.has-new-commits == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - develop
          - release/1
          - release/2
          - release/3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Sync ${{ matrix.branch }} to OpenCoDE
        uses: public-ui/kolibri/.github/actions/opencode-sync@develop
        with:
          branch: ${{ matrix.branch }}
          remote-url: https://OC000005112572:${{ secrets.GITLAB_PERSONAL_ACCESS_TOKEN }}@gitlab.opencode.de/OC000005112572/kolibri.git

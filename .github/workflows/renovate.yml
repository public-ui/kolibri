name: Renovate

# Self-hosted Renovate runner — see docs/RENOVATE.md.
#
# Triggers:
#   - schedule:          night window only — every 3 hours between 18:00 and 06:00 (Europe/Berlin).
#                        GitHub cron is UTC-only, so the hours below cover the window in both CET
#                        (UTC+1) and CEST (UTC+2): 16/19/22/01/04 UTC == 18/21/00/03/06 Berlin in
#                        summer and 17/20/23/02/05 Berlin in winter. The exact local window is
#                        enforced by renovate.json ("after 6pm" / "before 6am", timezone
#                        Europe/Berlin), so a run that falls outside it opens no PRs.
#   - workflow_dispatch: manual "Run workflow" button; optionally tick "dry_run" to preview
#                        what Renovate would do without creating branches/PRs.
#
# Auth: reuses the existing GitHub App (secrets.APP_ID / secrets.PRIVATE_KEY — the same app as
#       "04 - Update pnpm Lock"). The app installation must grant:
#         contents: write, pull-requests: write, issues: write (Dependency Dashboard),
#         workflows: write (so the github-actions manager can update .github/workflows/*),
#         statuses: write (minimumReleaseAge posts a renovate/stability-days commit status —
#         without it POST /statuses returns 403 and Renovate aborts the whole run with
#         result: "repository-changed" while the workflow still reports success)
#         and Dependabot alerts: read (otherwise vulnerabilityAlerts stays inactive).
# Alternative: drop the app-token step and pass a PAT via `token: ${{ secrets.RENOVATE_TOKEN }}`.

on:
  schedule:
    - cron: '0 18,21,0,3 * * 1-5'
      timezone: 'Europe/Berlin'
    - cron: '0 */3 * * 0,6'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — do not create branches/PRs'
        type: boolean
        default: false
      log_level:
        description: 'Renovate log level'
        type: choice
        options:
          - info
          - debug
        default: info

concurrency:
  group: 'workflow-${{ github.workflow }}'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    # Never run on forks (scheduled workflows would otherwise fire there too).
    if: github.repository == 'public-ui/kolibri'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.3
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          # Empty string is ignored by Renovate (skips unset env vars), so non-dry runs are unaffected.
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == true && 'full' || '' }}

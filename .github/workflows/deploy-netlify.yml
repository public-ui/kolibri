name: Deploy to Netlify (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (preview or production)'
        type: string
        required: true
      alias:
        description: 'Netlify alias for production deployments'
        type: string
        required: false
        default: ''

permissions:
  attestations: write
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # https://github.com/pnpm/action-setup#use-cache-to-reduce-installation-time
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        id: pnpm-install
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install
        run: pnpm i --no-frozen-lockfile --no-verify-store-integrity

      - name: Build
        run: pnpm --filter @public-ui/presentation... build

      - name: Attest presentation build
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: packages/samples/presentation/dist

      - name: Netlify Deploy (Preview)
        if: inputs.environment == 'preview'
        uses: netlify/actions/cli@master
        id: netlify-preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        with:
          args: deploy --no-build --filter=@public-ui/presentation -d packages/samples/presentation/dist

      - name: Netlify Deploy (Production)
        if: inputs.environment == 'production'
        uses: netlify/actions/cli@master
        id: netlify-production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_ALIAS: ${{ inputs.alias }}
        with:
          args: deploy --no-build --filter=@public-ui/presentation -d packages/samples/presentation/dist --alias="$NETLIFY_ALIAS"

      - name: Find comment (Preview only)
        if: inputs.environment == 'preview'
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Netlify Draft Deployment

      - name: Create or update comment (Preview)
        if: inputs.environment == 'preview'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Netlify Draft Deployment
            URL: ${{ steps.netlify-preview.outputs.NETLIFY_URL }}
            Logs: ${{ steps.netlify-preview.outputs.NETLIFY_LOGS_URL }}
          edit-mode: replace

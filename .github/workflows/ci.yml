  energy-report:
    runs-on: ubuntu-latest
    needs: [build-and-check, e2e-tests, visual-tests]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    continue-on-error: true
    steps:
      - name: Download all energy data
        uses: actions/download-artifact@v4
        with:
          pattern: energy-*
          path: /tmp/energy-data
          merge-multiple: true
        continue-on-error: true

      - name: Build energy report
        run: |
          {
            echo "## 🌱 Green Software – Energy Report"
            echo ""
            echo "Energieverbrauch der CI-Pipeline pro Job, gemessen mit [Eco CI](https://github.com/green-coding-solutions/eco-ci-energy-estimation)."
            echo ""
            echo "| Job | Energie (J) | Leistung ⌀ (W) |"
            echo "|-----|------------|----------------|"

            TOTAL_ENERGY=0

            if ls /tmp/energy-data/*.json 1>/dev/null 2>&1; then
              for f in $(ls /tmp/energy-data/*.json | sort); do
                JOB=$(jq -r '.job' "$f" 2>/dev/null || echo "unknown")
                ENERGY=$(jq -r '.energy_joules' "$f" 2>/dev/null || echo "0")
                POWER=$(jq -r '.power_avg_watts' "$f" 2>/dev/null || echo "0")
                # Round to 2 decimal places
                ENERGY_FMT=$(printf "%.2f" "$ENERGY" 2>/dev/null || echo "$ENERGY")
                POWER_FMT=$(printf "%.2f" "$POWER" 2>/dev/null || echo "$POWER")
                echo "| $JOB | $ENERGY_FMT | $POWER_FMT |"
                TOTAL_ENERGY=$(echo "$TOTAL_ENERGY + $ENERGY" | bc -l 2>/dev/null || echo "$TOTAL_ENERGY")
              done
            else
              echo "| _(keine Daten verfügbar)_ | – | – |"
            fi

            TOTAL_FMT=$(printf "%.2f" "$TOTAL_ENERGY" 2>/dev/null || echo "$TOTAL_ENERGY")
            echo ""
            echo "**Gesamtenergie: ${TOTAL_FMT} J**"
            echo ""

            # Budget check
            BUDGET=500
            OVER=$(echo "$TOTAL_ENERGY > $BUDGET" | bc -l 2>/dev/null || echo "0")
            if [ "$OVER" = "1" ]; then
              echo "> ⚠️ **Energie-Budget-Warnung:** Gesamtverbrauch ${TOTAL_FMT}J überschreitet den Schwellwert von ${BUDGET}J"
              echo ""
            fi

            echo "---"
            echo "<sub>Gemessen mit <a href=\"https://github.com/green-coding-solutions/eco-ci-energy-estimation\">Eco CI</a> · Details pro Job im jeweiligen Step Summary</sub>"
            echo ""
            echo "<!-- eco-ci-energy-report -->"
          } > /tmp/energy-report.md

          echo "--- Generated Report ---"
          cat /tmp/energy-report.md

      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- eco-ci-energy-report -->'

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body-path: /tmp/energy-report.md

  check-results:
    runs-on: ubuntu-latest
    needs: [build-and-check, e2e-tests, visual-tests]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [[ "${{ needs.build-and-check.result }}" == "failure" || \
                "${{ needs.e2e-tests.result }}" == "failure" || \
                "${{ needs.visual-tests.result }}" == "failure" ]]; then
            echo "At least one job failed"
            exit 1
          fi

name: CI-Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  push:
    branches:
      - 'develop'
      - 'main'
      - 'release/*'
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-check:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Validate package scripts
        run: pnpm check:scripts
      - name: Format
        run: pnpm -r format
      - name: Unused
        run: pnpm -r unused
      - name: Build
        run: pnpm -r build
      - name: Lint
        run: pnpm -r lint
      - name: Unit Tests
        run: pnpm -r test:unit

  e2e-tests:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E Test components
        run: pnpm --filter @public-ui/components test:e2e
      - name: React samples build dependencies
        run: pnpm --filter @public-ui/sample-react^... build
      - name: E2E Test react samples
        run: pnpm --filter @public-ui/sample-react test:e2e
      - uses: ./.github/actions/upload-reports
        if: failure()
        with:
          name: report-e2e

  visual-tests:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    strategy:
      matrix:
        package: ['test-tag-name-transformer', 'theme-bwst', 'theme-default', 'theme-desy', 'theme-kern', 'theme-ecl']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox
      - name: Build
        run: pnpm --filter @public-ui/sample-react^... build
      - name: Visual Tests
        run: pnpm --filter=@public-ui/${{ matrix.package }} test
      - uses: ./.github/actions/upload-reports
        if: failure()
        with:
          name: report-${{ matrix.package }}
      - name: Determine report path
        id: report-path
        if: ${{ !cancelled() }}
        run: |
          PACKAGE="${{ matrix.package }}"
          if [[ "${PACKAGE}" == 'test-tag-name-transformer' ]]; then
            REPORT_DIR="packages/test-tag-name-transformer/playwright-report"
            SLUG="tag-name-transformer"
          else
            THEME_DIR="${PACKAGE#theme-}"
            REPORT_DIR="packages/themes/${THEME_DIR}/playwright-report"
            SLUG="${THEME_DIR}"
          fi
          echo "dir=${REPORT_DIR}" >> "$GITHUB_OUTPUT"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          if [ -d "${REPORT_DIR}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload HTML report for consolidation
        if: ${{ !cancelled() && steps.report-path.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-${{ steps.report-path.outputs.slug }}
          path: ${{ steps.report-path.outputs.dir }}
          if-no-files-found: ignore
          retention-days: 5

  visual-tests-report:
    needs: visual-tests
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download report artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: visual-report-*
          path: artifacts
      - name: Stage reports under snaps-<theme>
        id: stage
        run: |
          set -o pipefail
          rm -rf public
          mkdir -p public
          shopt -s nullglob
          count=0
          for d in artifacts/visual-report-*/; do
            slug="$(basename "$d")"
            slug="${slug#visual-report-}"
            index="$(find "$d" -name index.html -printf '%d %p\n' 2>/dev/null | sort -n | head -1 | cut -d' ' -f2- || true)"
            if [ -n "$index" ]; then
              src="$(dirname "$index")"
              mkdir -p "public/snaps-${slug}"
              cp -a "${src}/." "public/snaps-${slug}/"
              count=$((count + 1))
            fi
          done
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Staged ${count} report(s)."
      - name: Ensure .nojekyll at gh-pages root
        if: ${{ steps.stage.outputs.count != '0' }}
        run: mkdir -p nojekyll-root && touch nojekyll-root/.nojekyll
      - name: Deploy .nojekyll to gh-pages root
        if: ${{ steps.stage.outputs.count != '0' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: nojekyll-root
          branch: gh-pages
          clean: false
      - name: Deploy reports to GitHub Pages
        if: ${{ steps.stage.outputs.count != '0' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          target-folder: pr-${{ github.event.pull_request.number }}
          branch: gh-pages
          clean: false
      - name: Post consolidated PR comment with report links
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const pr = context.issue.number;
            const marker = '<!-- visual-test-reports -->';
            const base = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${pr}`;
            const run = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const dir = 'public';
            const slugs = fs.existsSync(dir)
              ? fs
                  .readdirSync(dir)
                  .filter((n) => n.startsWith('snaps-') && fs.existsSync(path.join(dir, n, 'index.html')))
                  .map((n) => n.replace(/^snaps-/, ''))
                  .sort()
              : [];
            const label = (slug) => (slug === 'tag-name-transformer' ? 'test-tag-name-transformer' : `theme-${slug}`);
            const rows = slugs.map((slug) => `| \`${label(slug)}\` | [Open report](${base}/snaps-${slug}/) |`);
            const body =
              rows.length === 0
                ? `${marker}\n## 📸 Visual Test Reports\n\nNo Playwright HTML reports were produced for this run.\n\nRun: ${run}`
                : `${marker}\n## 📸 Visual Test Reports\n\n| Theme | Report |\n| --- | --- |\n${rows.join('\n')}\n\nRun: ${run}`;
            const { owner, repo } = context.repo;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr });
              const existing = comments.find((c) => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
              }
            } catch (error) {
              core.warning(`Could not post visual test report comment to PR #${pr}: ${error.message}`);
            }

  # lighthouse:
  #   continue-on-error: true
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v7
  #       with:
  #         persist-credentials: false
  #     - uses: ./.github/actions/pnpm-setup
  #     - name: Build dependencies
  #       run: pnpm --filter @public-ui/sample-react^... build
  #     - name: Lighthouse CI
  #       run: pnpm --filter @public-ui/sample-react lighthouse
  #     - uses: actions/upload-artifact@v4
  #       if: always()
  #       with:
  #         name: lighthouse-report
  #         path: packages/samples/react/.lighthouseci/

  check-results:
    runs-on: ubuntu-latest
    needs: [build-and-check, e2e-tests, visual-tests]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [[ "${{ needs.build-and-check.result }}" == "failure" || \
                "${{ needs.e2e-tests.result }}" == "failure" || \
                "${{ needs.visual-tests.result }}" == "failure" ]]; then
            echo "At least one job failed"
            exit 1
          fi

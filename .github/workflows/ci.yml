name: CI-Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  push:
    branches:
      - 'develop'
      - 'main'
      - 'release/*'
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-check:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Validate package scripts
        run: pnpm check:scripts
      - name: Format
        run: pnpm -r format
      - name: Unused
        run: pnpm -r unused
      - name: Build
        run: pnpm -r build
      - name: Lint
        run: pnpm -r lint
      - name: Unit Tests
        run: pnpm -r test:unit

  e2e-tests:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E Test components
        run: pnpm --filter @public-ui/components test:e2e
      - name: Presentation build dependencies
        run: pnpm --filter @public-ui/presentation^... build
      - name: E2E Test react samples
        run: pnpm --filter @public-ui/presentation test:e2e
      - uses: ./.github/actions/upload-reports
        if: failure()
        with:
          name: report-e2e

  # Compares the screenshots of the pull request with the baseline artifact of its base commit
  # (see docs/visual-review.md). Differences are not a failure of this job: they are published by
  # the "Visual Review" workflow and gate the merge through the commit status "Visual Review". The
  # job fails only when the comparison itself is broken (a route that throws, an invisible block,
  # a timeout) or a non-screenshot test (axe) fails.
  visual-tests:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        package: ['test-tag-name-transformer', 'unstyled', 'theme-bwst', 'theme-default', 'theme-desy', 'theme-kern', 'theme-ecl']
    runs-on: ubuntu-latest
    # Pinned Playwright image – must match the @playwright/test version in
    # packages/tools/visual-tests/package.json (enforced by the "Verify Playwright version" step).
    # --user 1001 (pwuser, same uid as the runner user): Firefox refuses to launch as root,
    # see https://playwright.dev/docs/ci#via-containers
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Verify Playwright version matches container image
        run: |
          INSTALLED=$(pnpm --filter @public-ui/visual-tests exec node -p "require('@playwright/test/package.json').version")
          [ "$INSTALLED" = "1.60.0" ] || { echo "::error::@playwright/test $INSTALLED does not match container image v1.60.0 – update the image tags in the workflows"; exit 1; }
      - name: Build
        run: pnpm --filter @public-ui/visual-tests^... build
      - name: Select baseline
        id: baseline
        run: node scripts/visual-review/select-baseline.mjs ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download baseline
        if: steps.baseline.outputs.artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          # Artifact ids are looked up within a run – the run of the "Visual Baseline" workflow
          # that produced the artifact, not this one.
          artifact-ids: ${{ steps.baseline.outputs.artifact_id }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline-download
      - name: Install baseline
        id: install
        run: node scripts/visual-review/install-baseline.mjs ${{ matrix.package }} baseline-download
      - name: Visual Tests
        id: test
        # Screenshot differences fail this step by design; the summary step below decides the job.
        continue-on-error: true
        run: pnpm --filter=@public-ui/${{ matrix.package }} test
      - uses: ./.github/actions/upload-reports
        if: steps.test.outcome == 'failure'
        with:
          name: report-${{ matrix.package }}
      # Summarises visual-report/report.json (written by packages/tools/visual-tests/src/visual-reporter.js)
      # into the job summary and fails on routes that could not be compared or on failed non-screenshot tests.
      - name: Visual review summary
        run: node scripts/visual-review/assert-no-errors.mjs ${{ matrix.package }}
      # report.json plus the PNGs of changed/added/removed snapshots – the input of the visual review.
      - name: Upload visual review report
        if: ${{ !cancelled() && steps.install.outputs.pkg_dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-review-${{ matrix.package }}
          path: ${{ steps.install.outputs.pkg_dir }}/visual-report
          if-no-files-found: warn
          retention-days: 14

  check-results:
    runs-on: ubuntu-latest
    needs: [build-and-check, e2e-tests, visual-tests]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [[ "${{ needs.build-and-check.result }}" == "failure" || \
                "${{ needs.e2e-tests.result }}" == "failure" || \
                "${{ needs.visual-tests.result }}" == "failure" ]]; then
            echo "At least one job failed"
            exit 1
          fi

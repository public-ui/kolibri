name: CI-Pipeline

on:
  pull_request:
  push:
    branches:
      - 'develop'
      - 'main'
      - 'release/*'
  workflow_dispatch:

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-check:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: 🌱 Start Energy Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          json-output: true
          send-data: true
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📊 Checkpoint - Checkout
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - uses: ./.github/actions/pnpm-setup

      - name: 📊 Checkpoint - Setup & Install
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'setup-and-install'
        continue-on-error: true

      - name: Build
        run: pnpm -r build

      - name: 📊 Checkpoint - Build
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'build'
        continue-on-error: true

      - name: Format
        run: pnpm -r format
      - name: Lint
        run: pnpm -r lint

      - name: Unit Tests
        run: pnpm -r test:unit

      - name: 📊 Checkpoint - Unit Tests
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'unit-tests'
        continue-on-error: true

      - name: Unused
        run: pnpm -r unused

      - name: 🌱 Display Energy Results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          pr-comment: true
          send-data: true
        continue-on-error: true

      - name: 📊 Save energy data
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/energy-export
          if [ -f /tmp/eco-ci/lap-data.json ]; then
            ENERGY=$(jq '[.steps[].energy_joules | tonumber] | add // 0' /tmp/eco-ci/lap-data.json 2>/dev/null || echo "0")
            POWER=$(jq '[.steps[].power_avg_watts | tonumber] | add / length // 0' /tmp/eco-ci/lap-data.json 2>/dev/null || echo "0")
          else
            ENERGY="0"
            POWER="0"
          fi
          cat > /tmp/energy-export/build-and-check.json <<EJSON
          {"job": "build-and-check", "energy_joules": "$ENERGY", "power_avg_watts": "$POWER"}
          EJSON

      - name: Upload energy data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-build-and-check
          path: /tmp/energy-export/
          retention-days: 1
        continue-on-error: true

  e2e-tests:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: 🌱 Start Energy Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          json-output: true
          send-data: true
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 📊 Checkpoint - Setup & Browsers
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'setup-and-browsers'
        continue-on-error: true

      - name: E2E Test components
        run: pnpm --filter @public-ui/components test:e2e

      - name: 📊 Checkpoint - E2E Components
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'e2e-components'
        continue-on-error: true

      - name: React samples build dependencies
        run: pnpm --filter @public-ui/sample-react^... build
      - name: E2E Test react samples
        run: pnpm --filter @public-ui/sample-react test:e2e

      - name: 📊 Checkpoint - E2E React Samples
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'e2e-react-samples'
        continue-on-error: true

      - name: 🌱 Display Energy Results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          pr-comment: true
          send-data: true
        continue-on-error: true

      - name: 📊 Save energy data
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/energy-export
          if [ -f /tmp/eco-ci/lap-data.json ]; then
            ENERGY=$(jq '[.steps[].energy_joules | tonumber] | add // 0' /tmp/eco-ci/lap-data.json 2>/dev/null || echo "0")
            POWER=$(jq '[.steps[].power_avg_watts | tonumber] | add / length // 0' /tmp/eco-ci/lap-data.json 2>/dev/null || echo "0")
          else
            ENERGY="0"
            POWER="0"
          fi
          cat > /tmp/energy-export/e2e-tests.json <<EJSON
          {"job": "e2e-tests", "energy_joules": "$ENERGY", "power_avg_watts": "$POWER"}
          EJSON

      - name: Upload energy data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-e2e-tests
          path: /tmp/energy-export/
          retention-days: 1
        continue-on-error: true

      - uses: ./.github/actions/upload-reports
        if: failure()
        with:
          name: report-e2e

  visual-tests:
    continue-on-error: true
    strategy:
      matrix:
        package: ['test-tag-name-transformer', 'theme-bwst', 'theme-default', 'theme-kern']
    runs-on: ubuntu-latest
    steps:
      - name: 🌱 Start Energy Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          json-output: true
          send-data: true
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox

      - name: 📊 Checkpoint - Setup & Browsers
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'setup-and-browsers'
        continue-on-error: true

      - name: Build
        run: pnpm --filter @public-ui/sample-react^... build

      - name: 📊 Checkpoint - Build
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'build'
        continue-on-error: true

      - name: Visual Tests
        run: pnpm --filter=@public-ui/${{ matrix.package }} test

      - name: 📊 Checkpoint - Visual Tests
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'visual-tests-${{ matrix.package }}'
        continue-on-error: true

      - name: 🌱 Display Energy Results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          pr-comment: true
          send-data: true
        continue-on-error: true

      - name: 📊 Save energy data
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/energy-export
          if [ -f /tmp/eco-ci/lap-data.json ]; then
            ENERGY=$(jq '[.steps[].energy_joules | tonumber] | add // 0' /tmp/eco-ci/lap-data.json 2>/dev/null || echo "0")
            POWER=$(jq '[.steps[].power_avg_watts | tonumber] | add / length // 0' /tmp/eco-ci/lap-data.json 2>/dev/null || echo "0")
          else
            ENERGY="0"
            POWER="0"
          fi
          cat > /tmp/energy-export/visual-${{ matrix.package }}.json <<EJSON
          {"job": "visual-tests (${{ matrix.package }})", "energy_joules": "$ENERGY", "power_avg_watts": "$POWER"}
          EJSON

      - name: Upload energy data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-visual-${{ matrix.package }}
          path: /tmp/energy-export/
          retention-days: 1
        continue-on-error: true

      - uses: ./.github/actions/upload-reports
        if: failure()
        with:
          name: report-${{ matrix.package }}


name: CI-Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - 'develop'
      - 'main'
      - 'release/*'
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'renovate.json'
      - 'publiccode.yml'
      - '.vscode/**'
      - 'license-reports/**'
      - '*.jpg'
      - '*.png'
      - '*.svg'
  workflow_dispatch:

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Writes the size gate comment of the pull request.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Validate package scripts
        run: pnpm check:scripts
      # Catches the two skeleton selector mistakes that visual snapshots cannot see, because
      # snapshots photograph resting states: a `&__element` glued to a modifier, and a state
      # predicate left on the class carrier (which is a wrapper element since the migration).
      - name: Validate skeleton selectors
        run: pnpm check:skeleton-selectors
      - name: Format
        run: pnpm -r format
      - name: Unused
        run: pnpm -r unused
      - name: Build
        run: pnpm -r build
      - name: Lint
        run: pnpm -r lint
      - name: Unit Tests
        run: pnpm -r test:unit
      # Pull-request runs compare their artifact sizes with the baseline that the "Size Baseline"
      # workflow computed for the base commit; push runs report their sizes without comparison.
      # Every step keeps going on error, so the size comparison can never block the merge.
      - name: Select size baseline
        id: size-baseline
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: node scripts/size-baseline/select-baseline.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download size baseline
        if: ${{ steps.size-baseline.outputs.artifact_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.size-baseline.outputs.artifact_id }}
          run-id: ${{ steps.size-baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: size-baseline-download
      - name: Install size baseline
        if: ${{ steps.size-baseline.outputs.artifact_id != '' }}
        continue-on-error: true
        run: |
          cp size-baseline-download/components.json packages/components/size-baseline.json
          cp size-baseline-download/theme-default.json packages/themes/default/size-baseline.json
      # Informational comparison of the artifact sizes of the components and theme-default with the
      # baseline of the target branch (installed above on pull requests; on push runs without
      # comparison); see docs/SIZE_GATE.md. The treemap and the restructuring candidates come from
      # the manually started workflow size-analysis.yml.
      - name: Size gate
        id: size-gate
        run: pnpm -r size
      # Keeps at most one size report comment on the pull request. It is created only for a notable
      # change and updated on every later run. Pull requests from forks get a read-only token;
      # for them the step only warns and the job summary carries the report.
      - name: Size gate comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        env:
          SIZE_GATE_OUTCOME: ${{ steps.size-gate.outcome }}
        with:
          script: |
            const workspace = process.env.GITHUB_WORKSPACE;
            const { renderPrComment, upsertPrComment } = await import(`${workspace}/packages/tools/size-gate/src/pr-comment.mjs`);
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const { body, notable } = renderPrComment({
              outcome: process.env.SIZE_GATE_OUTCOME || 'skipped',
              packageDirs: [`${workspace}/packages/components`, `${workspace}/packages/themes/default`],
              runUrl: `${repoUrl}/actions/runs/${context.runId}`,
              sha: context.payload.pull_request.head.sha,
            });
            try {
              const result = await upsertPrComment({ body, context, create: notable, github });
              core.info(`Size gate comment ${result.action} (${result.id}).`);
            } catch (error) {
              core.warning(`Could not write the size gate comment: ${error.message}`);
            }

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E Test components
        run: pnpm --filter @public-ui/components test:e2e
      - name: Presentation build dependencies
        run: pnpm --filter @public-ui/presentation^... build
      - name: E2E Test react samples
        run: pnpm --filter @public-ui/presentation test:e2e
      - uses: ./.github/actions/upload-reports
        if: failure()
        with:
          name: report-e2e

  # Compares the screenshots of the pull request with the baseline artifact of its base commit
  # (see docs/visual-review.md). Differences are not a failure of this job: they are published by
  # the "Visual Review" workflow and gate the merge through the commit status "Visual Review". The
  # job fails when the comparison itself is broken (a route that throws, an invisible block, a
  # timeout) or when axe reports a violation on a route without `axe.skipFailures` (see
  # packages/tools/visual-tests/tests/sample-app.routes.js). `color-contrast` counts only for the
  # default theme; the other themes report it without failing.
  visual-tests:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        package: ['test-tag-name-transformer', 'unstyled', 'theme-bwst', 'theme-default', 'theme-desy', 'theme-kern', 'theme-ecl']
    runs-on: ubuntu-latest
    # Pinned Playwright image – must match the @playwright/test version in
    # packages/tools/visual-tests/package.json (enforced by the "Verify Playwright version" step).
    # --user 1001 (pwuser, same uid as the runner user): Firefox refuses to launch as root,
    # see https://playwright.dev/docs/ci#via-containers
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Verify Playwright version matches container image
        run: |
          INSTALLED=$(pnpm --filter @public-ui/visual-tests exec node -p "require('@playwright/test/package.json').version")
          [ "$INSTALLED" = "1.63.0" ] || { echo "::error::@playwright/test $INSTALLED does not match container image v1.63.0 – update the image tags in the workflows"; exit 1; }
      - name: Build
        # The ecl theme no longer builds the ecl-icons font itself: the visual
        # tests load it from packages/themes/ecl/assets, so build it here.
        run: pnpm --filter @public-ui/visual-tests^... --filter @public-ui/ecl-icons build
      - name: Select baseline
        id: baseline
        run: node scripts/visual-review/select-baseline.mjs ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download baseline
        if: steps.baseline.outputs.artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          # Artifact ids are looked up within a run – the run of the "Visual Baseline" workflow
          # that produced the artifact, not this one.
          artifact-ids: ${{ steps.baseline.outputs.artifact_id }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline-download
      - name: Install baseline
        id: install
        run: node scripts/visual-review/install-baseline.mjs ${{ matrix.package }} baseline-download
      - name: Visual Tests
        id: test
        # Screenshot differences fail this step by design; the summary step below decides the job.
        continue-on-error: true
        run: pnpm --filter=@public-ui/${{ matrix.package }} test
      - uses: ./.github/actions/upload-reports
        if: steps.test.outcome == 'failure'
        with:
          name: report-${{ matrix.package }}
      # Summarises visual-report/report.json (written by packages/tools/visual-tests/src/visual-reporter.js)
      # into the job summary and fails on routes that could not be compared or on failed non-screenshot tests.
      - name: Visual review summary
        run: node scripts/visual-review/assert-no-errors.mjs ${{ matrix.package }}
      # report.json plus the PNGs of changed/added/removed snapshots – the input of the visual review.
      - name: Upload visual review report
        if: ${{ !cancelled() && steps.install.outputs.pkg_dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-review-${{ matrix.package }}
          path: ${{ steps.install.outputs.pkg_dir }}/visual-report
          if-no-files-found: warn
          retention-days: 14

name: CI-Pipeline

on:
  pull_request:
  push:
    branches:
      - 'develop'
      - 'main'
      - 'release/*'
  workflow_dispatch:

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-check:
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      energy: ${{ steps.eco-ci-final.outputs.energy-total }}
      carbon: ${{ steps.eco-ci-final.outputs.carbon-total }}
      power: ${{ steps.eco-ci-final.outputs.power-avg }}
    steps:
      - name: 🌱 Start Energy Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          send-data: true
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📊 Checkpoint - Checkout
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - uses: ./.github/actions/pnpm-setup

      - name: 📊 Checkpoint - Setup & Install
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'setup-and-install'
        continue-on-error: true

      - name: Build
        run: pnpm -r build

      - name: 📊 Checkpoint - Build
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'build'
        continue-on-error: true

      - name: Format
        run: pnpm -r format
      - name: Lint
        run: pnpm -r lint

      - name: Unit Tests
        run: pnpm -r test:unit

      - name: 📊 Checkpoint - Unit Tests
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'unit-tests'
        continue-on-error: true

      - name: Unused
        run: pnpm -r unused

      - name: 🌱 Final Energy Measurement
        id: eco-ci-final
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: final-measurement
          send-data: true
        continue-on-error: true

  e2e-tests:
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      energy: ${{ steps.eco-ci-final.outputs.energy-total }}
      carbon: ${{ steps.eco-ci-final.outputs.carbon-total }}
      power: ${{ steps.eco-ci-final.outputs.power-avg }}
    steps:
      - name: 🌱 Start Energy Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          send-data: true
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 📊 Checkpoint - Setup & Browsers
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'setup-and-browsers'
        continue-on-error: true

      - name: E2E Test components
        run: pnpm --filter @public-ui/components test:e2e

      - name: 📊 Checkpoint - E2E Components
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'e2e-components'
        continue-on-error: true

      - name: React samples build dependencies
        run: pnpm --filter @public-ui/sample-react^... build
      - name: E2E Test react samples
        run: pnpm --filter @public-ui/sample-react test:e2e

      - name: 📊 Checkpoint - E2E React Samples
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'e2e-react-samples'
        continue-on-error: true

      - name: 🌱 Final Energy Measurement
        id: eco-ci-final
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: final-measurement
          send-data: true
        continue-on-error: true

      - uses: ./.github/actions/upload-reports
        if: failure()
        with:
          name: report-e2e

  visual-tests:
    continue-on-error: true
    strategy:
      matrix:
        package: ['test-tag-name-transformer', 'theme-bwst', 'theme-default', 'theme-kern']
    runs-on: ubuntu-latest
    steps:
      - name: 🌱 Start Energy Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          send-data: true
        continue-on-error: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-setup
      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox

      - name: 📊 Checkpoint - Setup & Browsers
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'setup-and-browsers'
        continue-on-error: true

      - name: Build
        run: pnpm --filter @public-ui/sample-react^... build

      - name: 📊 Checkpoint - Build
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'build'
        continue-on-error: true

      - name: Visual Tests
        run: pnpm --filter=@public-ui/${{ matrix.package }} test

      - name: 📊 Checkpoint - Visual Tests
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'visual-tests-${{ matrix.package }}'
        continue-on-error: true

      - name: 🌱 Final Energy Measurement
        id: eco-ci-final
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: final-measurement
          send-data: true
        continue-on-error: true

      - name: Save energy data
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/energy-data
          cat > "/tmp/energy-data/${{ matrix.package }}.json" <<EJSON
          {
            "package": "${{ matrix.package }}",
            "energy": "${{ steps.eco-ci-final.outputs.energy-total }}",
            "carbon": "${{ steps.eco-ci-final.outputs.carbon-total }}",
            "power": "${{ steps.eco-ci-final.outputs.power-avg }}"
          }
          EJSON

      - name: Upload energy data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-visual-${{ matrix.package }}
          path: /tmp/energy-data/
          retention-days: 1
        continue-on-error: true

      - uses: ./.github/actions/upload-reports
        if: failure()
        with:
          name: report-${{ matrix.package }}

  # lighthouse:
  #   continue-on-error: true
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v6
  #       with:
  #         persist-credentials: false
  #     - uses: ./.github/actions/pnpm-setup
  #     - name: Build dependencies
  #       run: pnpm --filter @public-ui/sample-react^... build
  #     - name: Lighthouse CI
  #       run: pnpm --filter @public-ui/sample-react lighthouse
  #     - uses: actions/upload-artifact@v4
  #       if: always()
  #       with:
  #         name: lighthouse-report
  #         path: packages/samples/react/.lighthouseci/

  energy-report:
    runs-on: ubuntu-latest
    needs: [build-and-check, e2e-tests, visual-tests]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    continue-on-error: true
    steps:
      - name: Download visual-tests energy data
        uses: actions/download-artifact@v4
        with:
          pattern: energy-visual-*
          path: /tmp/energy-data
          merge-multiple: true
        continue-on-error: true

      - name: Build energy report
        id: report
        run: |
          # Collect build-and-check data
          BUILD_ENERGY="${{ needs.build-and-check.outputs.energy }}"
          BUILD_CARBON="${{ needs.build-and-check.outputs.carbon }}"
          BUILD_POWER="${{ needs.build-and-check.outputs.power }}"

          # Collect e2e-tests data
          E2E_ENERGY="${{ needs.e2e-tests.outputs.energy }}"
          E2E_CARBON="${{ needs.e2e-tests.outputs.carbon }}"
          E2E_POWER="${{ needs.e2e-tests.outputs.power }}"

          # Start building the report
          {
            echo "## 🌱 Green Software – Energy Report"
            echo ""
            echo "Energieverbrauch der CI-Pipeline, gemessen mit [Eco CI](https://github.com/green-coding-solutions/eco-ci-energy-estimation)."
            echo ""
            echo "### Übersicht"
            echo ""
            echo "| Job | Energie (J) | CO₂ (gCO₂eq) | Leistung ⌀ (W) |"
            echo "|-----|------------|---------------|----------------|"
            echo "| **build-and-check** | ${BUILD_ENERGY:-n/a} | ${BUILD_CARBON:-n/a} | ${BUILD_POWER:-n/a} |"
            echo "| **e2e-tests** | ${E2E_ENERGY:-n/a} | ${E2E_CARBON:-n/a} | ${E2E_POWER:-n/a} |"

            # Parse visual-tests artifacts
            VISUAL_TOTAL_ENERGY=0
            VISUAL_TOTAL_CARBON=0
            if ls /tmp/energy-data/*.json 1>/dev/null 2>&1; then
              for f in /tmp/energy-data/*.json; do
                PKG=$(jq -r '.package' "$f" 2>/dev/null || echo "unknown")
                VE=$(jq -r '.energy' "$f" 2>/dev/null || echo "")
                VC=$(jq -r '.carbon' "$f" 2>/dev/null || echo "")
                VP=$(jq -r '.power' "$f" 2>/dev/null || echo "")
                echo "| visual-tests ($PKG) | ${VE:-n/a} | ${VC:-n/a} | ${VP:-n/a} |"
                if [ -n "$VE" ] && [ "$VE" != "n/a" ] && [ "$VE" != "" ]; then
                  VISUAL_TOTAL_ENERGY=$(echo "$VISUAL_TOTAL_ENERGY + $VE" | bc -l 2>/dev/null || echo "$VISUAL_TOTAL_ENERGY")
                fi
                if [ -n "$VC" ] && [ "$VC" != "n/a" ] && [ "$VC" != "" ]; then
                  VISUAL_TOTAL_CARBON=$(echo "$VISUAL_TOTAL_CARBON + $VC" | bc -l 2>/dev/null || echo "$VISUAL_TOTAL_CARBON")
                fi
              done
            else
              echo "| **visual-tests** | n/a | n/a | n/a |"
            fi

            echo ""

            # Calculate total
            TOTAL_ENERGY=0
            TOTAL_CARBON=0
            for val in "$BUILD_ENERGY" "$E2E_ENERGY"; do
              if [ -n "$val" ]; then
                TOTAL_ENERGY=$(echo "$TOTAL_ENERGY + $val" | bc -l 2>/dev/null || echo "$TOTAL_ENERGY")
              fi
            done
            TOTAL_ENERGY=$(echo "$TOTAL_ENERGY + $VISUAL_TOTAL_ENERGY" | bc -l 2>/dev/null || echo "$TOTAL_ENERGY")

            for val in "$BUILD_CARBON" "$E2E_CARBON"; do
              if [ -n "$val" ]; then
                TOTAL_CARBON=$(echo "$TOTAL_CARBON + $val" | bc -l 2>/dev/null || echo "$TOTAL_CARBON")
              fi
            done
            TOTAL_CARBON=$(echo "$TOTAL_CARBON + $VISUAL_TOTAL_CARBON" | bc -l 2>/dev/null || echo "$TOTAL_CARBON")

            echo "### Gesamt"
            echo ""
            echo "| Metrik | Wert |"
            echo "|--------|------|"
            echo "| **Gesamtenergie** | ${TOTAL_ENERGY} J |"
            echo "| **Gesamt-CO₂** | ${TOTAL_CARBON} gCO₂eq |"
            echo ""

            # Budget check
            BUDGET=500
            if [ -n "$BUILD_ENERGY" ]; then
              OVER=$(echo "$BUILD_ENERGY > $BUDGET" | bc -l 2>/dev/null || echo "0")
              if [ "$OVER" = "1" ]; then
                echo "⚠️ **Energie-Budget-Warnung:** build-and-check verbraucht ${BUILD_ENERGY}J (Schwellwert: ${BUDGET}J)"
                echo ""
              fi
            fi

            echo "<sub>Gemessen mit <a href=\"https://github.com/green-coding-solutions/eco-ci-energy-estimation\">Eco CI Energy Estimation</a> · Daten auf <a href=\"https://metrics.green-coding.io\">Green Metrics Tool</a></sub>"
          } > /tmp/energy-report.md

          cat /tmp/energy-report.md

      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '🌱 Green Software – Energy Report'

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body-path: /tmp/energy-report.md

  check-results:
    runs-on: ubuntu-latest
    needs: [build-and-check, e2e-tests, visual-tests]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [[ "${{ needs.build-and-check.result }}" == "failure" || \
                "${{ needs.e2e-tests.result }}" == "failure" || \
                "${{ needs.visual-tests.result }}" == "failure" ]]; then
            echo "At least one job failed"
            exit 1
          fi

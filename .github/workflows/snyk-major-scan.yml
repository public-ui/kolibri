name: Snyk Major Scan

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ format('workflow-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  check-activity:
    name: Check for recent commits
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      should-scan: ${{ steps.activity.outputs.should-scan }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check last commit age
        id: activity
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          CURRENT=$(date +%s)
          DIFF=$((CURRENT - LAST_COMMIT))
          HOURS=$((DIFF / 3600))

          # For scheduled runs: only scan if commit is < 25 hours old (daily scan buffer)
          # For manual runs: always scan
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-scan=true" >> $GITHUB_OUTPUT
          elif [[ $HOURS -lt 25 ]]; then
            echo "should-scan=true" >> $GITHUB_OUTPUT
            echo "✅ Found recent commits (last commit was ${HOURS}h ago)"
          else
            echo "should-scan=false" >> $GITHUB_OUTPUT
            echo "⏭️  Skipping scan: no commits in last 25 hours (last commit was ${HOURS}h ago)"
          fi

  snyk-major-scan:
    needs: check-activity
    if: needs.check-activity.outputs.should-scan == 'true'
    name: Snyk Major Scan (v${{ matrix.major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major: [2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Snyk CLI
        run: |
          pnpm i
          npm install -g snyk

      - name: Run Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          WORKDIR="$(mktemp -d)"
          cat > "$WORKDIR/package.json" <<EOF
          {
          	"name": "kolibri-snyk-major-${{ matrix.major }}",
          	"private": true,
          	"dependencies": {
          		"@public-ui/components": "^${{ matrix.major }}"
          	}
          }
          EOF
          npm --prefix "$WORKDIR" install --package-lock-only --ignore-scripts --no-audit --no-fund
          snyk test --package-manager=npm --file="$WORKDIR/package.json" --project-name="kolibri-components-v${{ matrix.major }}"

name: 01 - Publish

env:
  prefix: # 'v4-', when v5 is released

on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        description: What do you want to publish?
        options:
          - 'rc-next: next RC of the current pre-release (4.5.0-rc.0 -> 4.5.0-rc.1), tag next'
          - 'rc-new-minor: first RC of the next minor (4.5.x -> 4.6.0-rc.0), tag next'
          - 'rc-new-patch: first RC of the next patch (4.5.0 -> 4.5.1-rc.0), tag next'
          - 'stable-from-rc: finalize the current RC (4.5.0-rc.3 -> 4.5.0), tag latest'
          - 'stable-patch: next patch (4.5.0 -> 4.5.1), tag latest'
          - 'stable-minor: next minor (4.5.x -> 4.6.0), tag latest'
          - 'dev: snapshot of the current commit without git push, tag dev'
          - 'republish-next: publish the current version as is, tag next'
          - 'republish-latest: publish the current version as is, tag latest'
      dry-run:
        type: boolean
        description: 'Dry run: resolve and validate the release, build and simulate the publish (nothing is pushed or published).'
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'public-ui/kolibri'
    runs-on: ubuntu-latest
    env:
      PACKAGE_DIRS: |
        packages/components
        packages/adapters/angular/v20
        packages/adapters/angular/v21
        packages/adapters/react
        packages/adapters/react-v19
        packages/adapters/react-standalone
        packages/adapters/solid
        packages/adapters/svelte
        packages/adapters/vue
        packages/adapters/preact
        packages/adapters/hydrate
        packages/adapters/react-hook-form-adapter
        packages/tools/kolibri-cli
        packages/tools/mcp
        packages/themes/bwst
        packages/themes/default
        packages/themes/desy
        packages/themes/ecl
        packages/themes/kern
        packages/themes
        packages/samples/react
        packages/tools/visual-tests
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        id: pnpm-install
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store
          restore-keys: |
            ${{ runner.os }}-pnpm-store

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Configure Git user
        run: |
          git config --local user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git config --local user.name "${{ steps.app-token.outputs.app-slug }}[bot]"

      - name: Resolve release
        id: release
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          RELEASE="${RELEASE_INPUT%%:*}"
          CURRENT=$(node -p "require('./package.json').version")
          BUMP=""
          PREID=""
          TAG=""
          NO_PUSH="false"

          case "$RELEASE" in
            rc-next)        BUMP=prerelease; PREID=rc; TAG=next ;;
            rc-new-minor)   BUMP=preminor;   PREID=rc; TAG=next ;;
            rc-new-patch)   BUMP=prepatch;   PREID=rc; TAG=next ;;
            stable-from-rc) BUMP=patch;      TAG=latest ;;
            stable-patch)   BUMP=patch;      TAG=latest ;;
            stable-minor)   BUMP=minor;      TAG=latest ;;
            dev)            BUMP=prerelease; PREID="$GITHUB_SHA"; TAG=dev; NO_PUSH="true" ;;
            republish-next)   TAG=next ;;
            republish-latest) TAG=latest ;;
            *) echo "::error::Unknown release option '$RELEASE'"; exit 1 ;;
          esac

          case "$RELEASE" in
            rc-next)
              [[ "$CURRENT" == *-rc.* ]] || { echo "::error::rc-next requires a current RC version, but the repository is at $CURRENT. Use rc-new-minor or rc-new-patch to start a new RC line."; exit 1; }
              ;;
            stable-from-rc)
              [[ "$CURRENT" == *-* ]] || { echo "::error::stable-from-rc requires a current pre-release version, but the repository is at $CURRENT. Use stable-patch or stable-minor."; exit 1; }
              ;;
            stable-patch|stable-minor)
              [[ "$CURRENT" != *-* ]] || { echo "::error::$RELEASE would only finalize the current pre-release $CURRENT. Use stable-from-rc."; exit 1; }
              ;;
          esac

          if [ "$TAG" = "latest" ] && [ -z "$BUMP" ] && [[ "$CURRENT" == *-* ]]; then
            echo "::error::Refusing to publish the pre-release $CURRENT with tag latest."
            exit 1
          fi

          {
            echo "bump=$BUMP"
            echo "preid=$PREID"
            echo "tag=$TAG"
            echo "no-push=$NO_PUSH"
            echo "current=$CURRENT"
          } >> "$GITHUB_OUTPUT"

      - name: Bump versions
        if: steps.release.outputs.bump != ''
        env:
          BUMP: ${{ steps.release.outputs.bump }}
          PREID: ${{ steps.release.outputs.preid }}
          NO_PUSH: ${{ steps.release.outputs.no-push == 'true' || github.event.inputs.dry-run == 'true' }}
        run: |
          ARGS=("$BUMP")
          [ -n "$PREID" ] && ARGS+=("--preid=$PREID")
          [ "$NO_PUSH" = "true" ] && ARGS+=("--no-push")
          HUSKY=0 node scripts/version.mjs "${ARGS[@]}"

      - name: Validate resolved version
        id: version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" = "latest" ] && [[ "$VERSION" == *-* ]]; then
            echo "::error::Refusing to publish the pre-release $VERSION with tag latest."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          RELEASE: ${{ github.event.inputs.release }}
          CURRENT: ${{ steps.release.outputs.current }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          {
            echo "### Publish"
            echo "- **Release:** ${RELEASE%%:*}"
            echo "- **Version:** \`$CURRENT\` → \`$VERSION\`"
            echo "- **npm tag:** \`${{ env.prefix }}$TAG\`"
            echo "- **Dry run:** $DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build all packages
        run: pnpm -r build

      - name: Publish all packages
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPMJS_GRANULAR_TOKEN}}
          NPM_CONFIG_PROVENANCE: true
          TAG: ${{ steps.release.outputs.tag }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          EXTRA=()
          [ "$DRY_RUN" = "true" ] && EXTRA+=("--dry-run")

          while read -r DIR; do
            [ -z "$DIR" ] && continue
            echo "Publishing package from ${DIR}"
            (
              cd "$DIR"
              bash "${GITHUB_WORKSPACE}/scripts/safe-publish.sh" --access public --provenance --no-git-checks --tag "${{env.prefix}}${TAG}" "${EXTRA[@]}"
            )
          done <<< "$PACKAGE_DIRS"

      - name: Verify all packages published to npmjs
        if: github.event.inputs.dry-run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPMJS_GRANULAR_TOKEN}}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Verifying version: $VERSION"
          FAILED=()
          COUNT=0

          while read -r DIR; do
            [ -z "$DIR" ] && continue
            COUNT=$((COUNT + 1))
            PKG=$(node -p "require('./${DIR}/package.json').name")
            PUBLISHED=$(npm view "${PKG}@${VERSION}" version --registry https://registry.npmjs.org 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "✅ ${PKG}@${VERSION}"
            else
              echo "❌ ${PKG}@${VERSION} – NOT found on npm (got: '$PUBLISHED')"
              FAILED+=("$PKG")
            fi
          done <<< "$PACKAGE_DIRS"

          if [ ${#FAILED[@]} -ne 0 ]; then
            echo ""
            echo "❌ The following packages were NOT successfully published:"
            printf '  - %s\n' "${FAILED[@]}"
            exit 1
          fi

          echo "✅ All ${COUNT} packages verified on npmjs registry."

      - name: Update version tag for stable deployments
        if: steps.release.outputs.tag == 'latest' && github.event.inputs.dry-run != 'true'
        run: |
          VERSION_TAG="${{env.prefix}}latest"
          echo "Updating version tag: $VERSION_TAG"
          git tag -d "$VERSION_TAG" 2>/dev/null || true
          git push origin ":refs/tags/$VERSION_TAG" 2>/dev/null || true
          git tag -a "$VERSION_TAG" -m "Update $VERSION_TAG to $(git describe --tags --abbrev=0)"
          git push origin "$VERSION_TAG"
          echo "Successfully updated tag $VERSION_TAG"

name: Auto dependency updater

env:
  issue: 6350

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: develop
            version: v4
          - base: release/3
            version: v3
          - base: release/2
            version: v2
          - base: release/1
            version: v1
    env:
      version: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.base }}
          persist-credentials: false
      - name: Remove overrides before install
        run: |
          if grep -q '^overrides:' pnpm-workspace.yaml; then
            sed -i '/^overrides:/,$ d' pnpm-workspace.yaml
          fi
      - uses: actions/setup-node@v6
        with:
          # cache: pnpm
          node-version: 24
      - uses: pnpm/action-setup@v5
        id: pnpm-install
        with:
          version: 10
          run_install: false
      - name: Install
        run: pnpm i --no-frozen-lockfile --ignore-scripts
      - name: Update dependencies (minor)
        run: |
          pnpm ncu:minor
          # Run the recursive update twice so peer and dev dependency bumps align after the first pass adjusts peer ranges.
          pnpm ncu:minor
      - name: Reinstall dependencies (prepare for fix)
        run: pnpm i --no-frozen-lockfile --ignore-scripts
      - name: Try to fix audit issues
        run: pnpm audit --audit-level high --fix --production
      - name: Reinstall dependencies (final lock file)
        run: pnpm i --no-frozen-lockfile --ignore-scripts
      - name: Fix format
        run: pnpm format -w

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ matrix.base }}
          branch: ${{ env.issue }}-${{ env.version }}/auto-update-deps
          commit-message: 'chore: update dependencies and lock file'
          title: 'chore(${{ env.version }}): update dependencies and lock file'
          body: 'Automated dependency updates from issue #${{ env.issue }} for ${{ env.version }}.'
          delete-branch: true

      - name: Run audit
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: pnpm audit --audit-level high --production
      - name: Run build
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: pnpm build
      - name: Run format
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: pnpm format
      - name: Run lint
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: pnpm lint
      - name: Run unit tests
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: pnpm test:unit
      - name: Run e2e tests
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          npx playwright install chromium
          pnpm test:e2e
      - name: Run unused
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: pnpm unused

      - name: Update dependencies (major)
        run: pnpm ncu:major

name: Visual Tests Snapshot Comparison

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - 'packages/components/**'
      - 'packages/themes/**'
      - 'packages/samples/react/**'
      - 'packages/tools/visual-tests/**'
      - 'packages/test-tag-name-transformer/**'
      - '.github/workflows/visual-tests-base.yml'
      - '.github/actions/pnpm-setup/**'
      - '.github/actions/upload-reports/**'

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  visual-tests-snapshots:
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        package: ['test-tag-name-transformer', 'theme-default', 'theme-bwst', 'theme-ecl', 'theme-desy', 'theme-kern']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: ./.github/actions/pnpm-setup

      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox

      - name: Build base branch
        run: pnpm --filter @public-ui/visual-tests^... build

      - name: Generate base snapshots
        run: pnpm --filter=@public-ui/${{ matrix.package }} test:update:e2e

      - name: Store base snapshots
        run: |
          set -eo pipefail
          PACKAGE="${{ matrix.package }}"
          mkdir -p "/tmp/snapshots/${PACKAGE}"
          if [[ "${PACKAGE}" == 'test-tag-name-transformer' ]]; then
            SNAPSHOT_DIR="packages/test-tag-name-transformer/snapshots"
          else
            THEME_DIR="${PACKAGE#theme-}"
            SNAPSHOT_DIR="packages/themes/${THEME_DIR}/snapshots"
          fi
          if [ -d "$SNAPSHOT_DIR" ]; then
            rsync -a "$SNAPSHOT_DIR/" "/tmp/snapshots/${PACKAGE}/"
          fi

      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/pnpm-setup

      - name: Restore base snapshots
        run: |
          set -eo pipefail
          PACKAGE="${{ matrix.package }}"
          if [[ "${PACKAGE}" == 'test-tag-name-transformer' ]]; then
            SNAPSHOT_DIR="packages/test-tag-name-transformer/snapshots"
          else
            THEME_DIR="${PACKAGE#theme-}"
            SNAPSHOT_DIR="packages/themes/${THEME_DIR}/snapshots"
          fi
          rm -rf "$SNAPSHOT_DIR"
          mkdir -p "$SNAPSHOT_DIR"
          if [ -d "/tmp/snapshots/${PACKAGE}" ]; then
            rsync -a "/tmp/snapshots/${PACKAGE}/" "$SNAPSHOT_DIR/"
          fi

      - name: Build head branch
        run: pnpm --filter @public-ui/visual-tests^... build

      - name: Visual Tests
        run: pnpm --filter=@public-ui/${{ matrix.package }} test

      - uses: ./.github/actions/upload-reports
        if: failure()
        with:
          name: report-base-snapshots-${{ matrix.package }}

      - name: Upload base snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: base-snapshots-${{ matrix.package }}
          path: /tmp/snapshots/${{ matrix.package }}
          if-no-files-found: ignore

      - name: Determine report path
        id: report-path
        if: always() && github.event.pull_request.head.repo.fork == false
        run: |
          PACKAGE="${{ matrix.package }}"
          if [[ "${PACKAGE}" == 'test-tag-name-transformer' ]]; then
            REPORT_DIR="packages/test-tag-name-transformer/playwright-report"
          else
            THEME_DIR="${PACKAGE#theme-}"
            REPORT_DIR="packages/themes/${THEME_DIR}/playwright-report"
          fi
          echo "path=${REPORT_DIR}" >> $GITHUB_OUTPUT
          if [ -d "${REPORT_DIR}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy report to GitHub Pages
        if: always() && github.event.pull_request.head.repo.fork == false && steps.report-path.outputs.exists == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ steps.report-path.outputs.path }}
          target-folder: pr-${{ github.event.pull_request.number }}/${{ matrix.package }}
          branch: gh-pages
          clean: false

      - name: Find existing PR comment
        if: always() && github.event.pull_request.head.repo.fork == false
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- visual-test-report-${{ matrix.package }} -->'

      - name: Post PR comment with report link
        if: always() && github.event.pull_request.head.repo.fork == false
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- visual-test-report-${{ matrix.package }} -->
            ## Visual Test Report — `${{ matrix.package }}`
            [Open Playwright Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/${{ matrix.package }}/)

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

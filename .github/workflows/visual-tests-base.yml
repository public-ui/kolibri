name: Visual Tests Snapshot Comparison

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - 'packages/components/**'
      - 'packages/themes/**'
      - 'packages/samples/react/**'
      - 'packages/test-tag-name-transformer/**'
      - '.github/workflows/visual-tests-base.yml'
      - '.github/actions/pnpm-setup/**'
      - '.github/actions/upload-reports/**'

concurrency:
  group: 'workflow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  visual-tests-snapshots:
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        package: ['test-tag-name-transformer', 'theme-default', 'theme-bwst', 'theme-ecl', 'theme-desy', 'theme-kern']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: ./.github/actions/pnpm-setup

      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox

      - name: Build base branch
        run: pnpm --filter @public-ui/sample-react^... build

      - name: Generate base snapshots
        run: pnpm --filter=@public-ui/${{ matrix.package }} test:update:e2e

      - name: Store base snapshots
        run: |
          set -eo pipefail
          PACKAGE="${{ matrix.package }}"
          mkdir -p "/tmp/snapshots/${PACKAGE}"
          if [[ "${PACKAGE}" == 'test-tag-name-transformer' ]]; then
            SNAPSHOT_DIR="packages/test-tag-name-transformer/snapshots"
          else
            THEME_DIR="${PACKAGE#theme-}"
            SNAPSHOT_DIR="packages/themes/${THEME_DIR}/snapshots"
          fi
          if [ -d "$SNAPSHOT_DIR" ]; then
            rsync -a "$SNAPSHOT_DIR/" "/tmp/snapshots/${PACKAGE}/"
          fi

      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/pnpm-setup

      - name: Restore base snapshots
        run: |
          set -eo pipefail
          PACKAGE="${{ matrix.package }}"
          if [[ "${PACKAGE}" == 'test-tag-name-transformer' ]]; then
            SNAPSHOT_DIR="packages/test-tag-name-transformer/snapshots"
          else
            THEME_DIR="${PACKAGE#theme-}"
            SNAPSHOT_DIR="packages/themes/${THEME_DIR}/snapshots"
          fi
          rm -rf "$SNAPSHOT_DIR"
          mkdir -p "$SNAPSHOT_DIR"
          if [ -d "/tmp/snapshots/${PACKAGE}" ]; then
            rsync -a "/tmp/snapshots/${PACKAGE}/" "$SNAPSHOT_DIR/"
          fi

      - name: Build head branch
        run: pnpm --filter @public-ui/sample-react^... build

      - name: Visual Tests
        run: pnpm --filter=@public-ui/${{ matrix.package }} test

      - uses: ./.github/actions/upload-reports
        if: failure()
        with:
          name: report-base-snapshots-${{ matrix.package }}

      - name: Upload base snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: base-snapshots-${{ matrix.package }}
          path: /tmp/snapshots/${{ matrix.package }}
          if-no-files-found: ignore

      - name: Determine report path
        id: report-path
        if: always() && github.event.pull_request.head.repo.fork == false
        run: |
          PACKAGE="${{ matrix.package }}"
          if [[ "${PACKAGE}" == 'test-tag-name-transformer' ]]; then
            REPORT_DIR="packages/test-tag-name-transformer/playwright-report"
            SLUG="tag-name-transformer"
          else
            THEME_DIR="${PACKAGE#theme-}"
            REPORT_DIR="packages/themes/${THEME_DIR}/playwright-report"
            SLUG="${THEME_DIR}"
          fi
          echo "path=${REPORT_DIR}" >> $GITHUB_OUTPUT
          echo "slug=${SLUG}" >> $GITHUB_OUTPUT
          if [ -d "${REPORT_DIR}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy report to GitHub Pages
        if: always() && github.event.pull_request.head.repo.fork == false && steps.report-path.outputs.exists == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ steps.report-path.outputs.path }}
          target-folder: pr-${{ github.event.pull_request.number }}/snaps-${{ steps.report-path.outputs.slug }}
          branch: gh-pages
          clean: false

  report-comment:
    needs: visual-tests-snapshots
    if: ${{ !cancelled() && github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          persist-credentials: true

      - name: Ensure .nojekyll at gh-pages root
        run: |
          if [ ! -f .nojekyll ]; then
            touch .nojekyll
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .nojekyll
            git commit -m "chore: add .nojekyll to gh-pages root"
            git push
          fi

      - name: Post consolidated PR comment with report links
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const pr = context.issue.number;
            const marker = '<!-- visual-test-reports -->';
            const base = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${pr}`;
            const run = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const reports = [
              { slug: 'default', label: 'theme-default' },
              { slug: 'bwst', label: 'theme-bwst' },
              { slug: 'ecl', label: 'theme-ecl' },
              { slug: 'desy', label: 'theme-desy' },
              { slug: 'kern', label: 'theme-kern' },
              { slug: 'tag-name-transformer', label: 'test-tag-name-transformer' },
            ];
            const rows = reports
              .filter((r) => fs.existsSync(`pr-${pr}/snaps-${r.slug}/index.html`))
              .map((r) => `| \`${r.label}\` | [Open report](${base}/snaps-${r.slug}/) |`);
            const body = rows.length === 0
              ? `${marker}\n## 📸 Visual Test Reports\n\nNo Playwright HTML reports were produced for this run.\n\nRun: ${run}`
              : `${marker}\n## 📸 Visual Test Reports\n\n| Theme | Report |\n| --- | --- |\n${rows.join('\n')}\n\nRun: ${run}`;
            const { owner, repo } = context.repo;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr });
              const existing = comments.find((c) => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
              }
            } catch (error) {
              core.warning(`Could not post visual test report comment to PR #${pr}: ${error.message}`);
            }

[build]
  # Da es nur Netlify Functions sind, brauchen wir keinen Build-Befehl
  command = "echo 'No build required for MCP functions'"

  # Functions directory relativ zum Repository-Root
  functions = "packages/tools/mcp/netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Redirect alle MCP-Requests zur Netlify-Funktion
[[redirects]]
  from = "/mcp/*"
  to = "/.netlify/functions/mcp/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/mcp/health"
  status = 200

[[redirects]]
  from = "/samples"
  to = "/.netlify/functions/mcp/samples"
  status = 200

[[redirects]]
  from = "/sample"
  to = "/.netlify/functions/mcp/sample"
  status = 200

[[redirects]]
  from = "/refresh"
  to = "/.netlify/functions/mcp/refresh"
  status = 200

# CORS Headers für alle API-Endpunkte
[[headers]]
  for = "/.netlify/functions/mcp/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

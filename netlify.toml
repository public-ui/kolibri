[build]
  # Build command - Sample-Index wird über GitHub Workflow vorbereitet
  command = "echo 'Sample index built by GitHub workflow'"

  # Functions directory relativ zum Repository-Root
  functions = "packages/tools/mcp/netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Redirect alle Requests zur Netlify-Funktion
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/mcp/:splat"
  status = 200

# CORS Headers für alle API-Endpunkte
[[headers]]
  for = "/.netlify/functions/mcp/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

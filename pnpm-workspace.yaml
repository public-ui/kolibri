packages:
  - packages/adapters/angular/*
  - packages/adapters/hydrate*
  - packages/adapters/preact*
  - packages/adapters/react*
  - packages/adapters/solid*
  - packages/adapters/svelte
  - packages/adapters/vue
  - packages/components
  - packages/icons
  - packages/ecl-icons
  - packages/samples/angular
  - packages/samples/presentation
  - packages/samples/react
  - packages/test-tag-name-transformer
  - packages/themes/bwst
  - packages/themes/default
  - packages/themes/desy
  - packages/themes/ecl
  - packages/themes/kern
  - packages/themes
  - packages/tools/benchmark-tests
  - packages/tools/eslint-config
  - packages/tools/kolibri-cli
  - packages/tools/hydrate-server
  - packages/tools/mcp
  - packages/tools/stylelint-rules
  - packages/tools/visual-tests
  - packages/unstyled

allowBuilds:
  '@evilmartians/lefthook': true
  '@modelcontextprotocol/ext-apps': true
  '@modelcontextprotocol/inspector': true
  '@parcel/watcher': true
  '@swc/core': true
  chromedriver: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: true
  ttf2woff2: true
  unrs-resolver: true

patchedDependencies:
  # Since 4.43.2 the spec test transpiler resolves base classes from other files through
  # `tsGetSourceFile`, whose compiler host parses without parent nodes. `getText()` on such a node
  # throws, so every spec of a component that extends an imported base class fails to run.
  # Drop the patch once Stencil passes `setParentNodes` to `createCompilerHost` itself.
  '@stencil/core@4.45.2': patches/@stencil__core@4.45.2.patch

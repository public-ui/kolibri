        <g id="kol-progress__bar-unit" data-name="kol-progress__bar-unit"><text x="702.8" y="34.1" font-family="Verdana, Arial, Calibri, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="rgb(233, 235, 236)" stroke="none" xml:space="preserve">%</text></g></g>
      <g id="span" data-name="span"><text x="-40.0" y="-307.1" font-family="Verdana, Arial, Calibri, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="rgb(233, 235, 236)" stroke="none" xml:space="preserve">57 %</text></g></g></g>

<svg xmlns="http://www.w3.org/2000/svg" id="kol-progress" data-name="kol-progress" width="720" height="38" viewBox="0 0 720 38">
  <g id="kol-progress" data-name="kol-progress"><rect x="0" y="0" width="720.0" height="38.0" fill="rgb(20, 24, 26)" stroke="none"/>
    <g id="kol-progress" data-name="kol-progress">
      <g id="kol-progress__bar" data-name="kol-progress__bar">
        <g id="kol-progress__bar-label" data-name="kol-progress__bar-label"><text x="0.0" y="15.1" font-family="Verdana, Arial, Calibri, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="rgb(233, 235, 236)" stroke="none" xml:space="preserve">Distanz</text></g>
        <g id="kol-progress__bar" data-name="kol-progress__bar" transform="translate(0.0,22.5)"><rect class="kol-progress__bar-background" x="1" y="1" height="11" rx="5" fill="currentColor" stroke="currentColor" stroke-width="3" width="100%"></rect><rect class="kol-progress__bar-border" x="1" y="1" height="11" rx="5" fill="currentColor" stroke="currentColor" stroke-width="1" width="100%"></rect><rect class="kol-progress__bar-progress" x="3" y="3" height="7" rx="3.5" fill="currentColor" stroke="currentColor" stroke-width="3" style="width: calc(57.1429% - 4px);"></rect></g>

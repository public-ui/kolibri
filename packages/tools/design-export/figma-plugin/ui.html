<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				font:
					12px/1.5 system-ui,
					sans-serif;
				margin: 0;
				padding: 12px;
			}
			button {
				margin-top: 10px;
				padding: 6px 12px;
			}
			#log {
				background: #f5f5f5;
				font:
					11px/1.5 ui-monospace,
					monospace;
				height: 220px;
				margin-top: 10px;
				overflow-y: auto;
				padding: 6px;
				white-space: pre-wrap;
			}
		</style>
	</head>
	<body>
		<label for="file">figma-import.json aus <code>dist-export/spec/</code></label>
		<input id="file" type="file" accept="application/json" />
		<button id="run" disabled>Bibliothek abgleichen</button>
		<div id="log" aria-live="polite"></div>
		<script>
			const log = (text) => {
				document.getElementById('log').textContent += `${text}\n`;
			};
			let payload;
			document.getElementById('file').addEventListener('change', async (event) => {
				const file = event.target.files[0];
				if (!file) return;
				payload = JSON.parse(await file.text());
				log(
					`Geladen: ${payload.componentSets.length} Component Sets, ${payload.variables.variables.length} Variablen (${payload.themeName}, Komponenten ${payload.version.components}).`,
				);
				document.getElementById('run').disabled = false;
			});
			document.getElementById('run').addEventListener('click', () => parent.postMessage({ pluginMessage: { type: 'import', payload } }, '*'));
			onmessage = (event) => {
				const message = event.data.pluginMessage;
				if (message && message.type === 'log') log(message.text);
			};
		</script>
	</body>
</html>

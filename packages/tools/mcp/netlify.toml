[build]
  # TypeScript Functions mit automatischem Bundling
  command = "echo 'TypeScript MCP Functions ready'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Functions directory (standard Netlify location)
  directory = ".netlify/functions"
  # Enable TypeScript support with esbuild
  node_bundler = "esbuild"

# Mit TypeScript Function Routing über config.path
# Keine manuellen Redirects mehr nötig

# CORS Headers für Function responses
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

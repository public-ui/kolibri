[build]
  # Generate the sample index before bundling the function
  command = "pnpm --filter @public-ui/mcp prebuild"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Standard Netlify functions directory
  directory = "netlify/functions"
  included_files = ["netlify/functions/sample-index.json"]

# Rewrite API-Routen ohne Präfix auf die Function
[[redirects]]
  from = "/"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/mcp/health"
  status = 200

[[redirects]]
  from = "/samples"
  to = "/.netlify/functions/mcp/samples"
  status = 200

[[redirects]]
  from = "/sample"
  to = "/.netlify/functions/mcp/sample"
  status = 200

[[redirects]]
  from = "/refresh"
  to = "/.netlify/functions/mcp/refresh"
  status = 200

# CORS Headers für Function responses
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

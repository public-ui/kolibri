<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="kolibri-logo-animated-title kolibri-logo-animated-desc">
	<title id="kolibri-logo-animated-title">KoliBri</title>
	<desc id="kolibri-logo-animated-desc">Kolibri-Logo aus sechs Segmenten und sieben farblindensicheren Farben (Okabe-Ito). Jede Sekunde wechselt genau ein Segment auf die gerade ungenutzte Farbe, sodass die freie Farbe im Kreis um die Form wandert. Bei aktivierter Einstellung „Bewegung reduzieren“ steht das Logo statisch dar.</desc>
	<!--
		Farblindensichere Palette (angelehnt an Okabe-Ito, https://davidmathlogic.com/colorblindness/).
		Wechselspiel: 6 Segmente, 7 Farben. Jede Sekunde wechselt genau ein Segment (abwechselnd im
		Ring Schnabel, oberer Flügel, Kopf, Schwanz, Körper, unterer Flügel) auf die aktuell ungenutzte
		Farbe und gibt die eigene frei; die freie Farbe wandert dadurch im Kreis. Kein Segment wechselt
		gleichzeitig mit einem anderen, jeder Gesamtzyklus dauert 42 Sekunden (42 Wechsel).
		Technisch teilen sich alle Segmente einen Keyframes-Satz: Jedes Segment führt die Farbfolge in
		eigener Drehphase (Variablen c0 bis c6) und startet per negativem Delay versetzt. Die Kontraste
	aller dabei entstehenden Nachbarpaare wurden vorab per Skript über alle 42 Zustände geprüft;
		die weißen Trennfugen tragen die Unterscheidbarkeit zusätzlich (WCAG 1.4.1). Die Animation
		läuft als reines CSS auch in img-Kontexten und respektiert prefers-reduced-motion.
	-->
	<style>
		/*
		 * 42s Gesamtzyklus, 1s pro Wechsel: Jedes Segment hält seine Farbe 0,7s und blendet
		 * dann 0,3s auf seine nächste Farbe (c0 bis c6). Die negativen Delays versetzen die
		 * Segmente so, dass jederzeit genau ein Segment im Übergang ist.
		 */
		.kol-seg {
			fill: var(--c0);
			animation: kol-wechselspiel 42s ease-in-out infinite;
		}
		.kol-seg:nth-of-type(1) { --c0: #56B4E9; --c1: #E69F00; --c2: #0072B2; --c3: #003C78; --c4: #CC79A7; --c5: #D55E00; --c6: #009E73; animation-delay: -38s; } /* Körper */
		.kol-seg:nth-of-type(2) { --c0: #009E73; --c1: #56B4E9; --c2: #E69F00; --c3: #0072B2; --c4: #003C78; --c5: #CC79A7; --c6: #D55E00; animation-delay: -37s; } /* unterer Flügel */
		.kol-seg:nth-of-type(3) { --c0: #0072B2; --c1: #003C78; --c2: #CC79A7; --c3: #D55E00; --c4: #009E73; --c5: #56B4E9; --c6: #E69F00; animation-delay: -40s; } /* Kopf */
		.kol-seg:nth-of-type(4) { --c0: #003C78; --c1: #CC79A7; --c2: #D55E00; --c3: #009E73; --c4: #56B4E9; --c5: #E69F00; --c6: #0072B2; animation-delay: -41s; } /* oberer Flügel */
		.kol-seg:nth-of-type(5) { --c0: #CC79A7; --c1: #D55E00; --c2: #009E73; --c3: #56B4E9; --c4: #E69F00; --c5: #0072B2; --c6: #003C78; animation-delay: -42s; } /* Schnabel */
		.kol-seg:nth-of-type(6) { --c0: #E69F00; --c1: #0072B2; --c2: #003C78; --c3: #CC79A7; --c4: #D55E00; --c5: #009E73; --c6: #56B4E9; animation-delay: -39s; } /* Schwanz */
		@keyframes kol-wechselspiel {
			0%      { fill: var(--c0); }
			13.571% { fill: var(--c0); }
			14.286% { fill: var(--c1); }
			27.857% { fill: var(--c1); }
			28.571% { fill: var(--c2); }
			42.143% { fill: var(--c2); }
			42.857% { fill: var(--c3); }
			56.429% { fill: var(--c3); }
			57.143% { fill: var(--c4); }
			70.714% { fill: var(--c4); }
			71.429% { fill: var(--c5); }
			85%     { fill: var(--c5); }
			85.714% { fill: var(--c6); }
			99.286% { fill: var(--c6); }
			100%    { fill: var(--c0); }
		}
		@media (prefers-reduced-motion: reduce) {
			.kol-seg {
				animation: none;
			}
		}
	</style>
	<g>
		<path class="kol-seg" d="M353 322L213 304V434L353 322Z" />
		<path class="kol-seg" d="M209 564V304L149 434L209 564Z" />
		<path class="kol-seg" d="M357 316L417 250L361 210L275 244L357 316Z" />
		<path class="kol-seg" d="M329 218L237 92L250 222L272 241L329 218Z" />
		<path class="kol-seg" d="M353 318L35 36L213 300L353 318Z" />
		<path class="kol-seg" d="M391 286L565 272L421 252L391 286Z" />
	</g>
</svg>

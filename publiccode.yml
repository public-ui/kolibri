description:
  de:
    shortDescription: KoliBri – Die barrierefreie WebComponent-Bibliothek
    longDescription: >
      HTML ist bewusst offen spezifiziert, um langlebig und robust zu sein. Dadurch entstehen jedoch häufig nicht barrierefreie, semantisch inkorrekte oder ungültige HTML-Kompositionen. KoliBri baut direkt auf den W3C-Webstandards auf, ist framework-agnostisch und bietet eine generische Referenzimplementierung der WCAG und BITV. Die Bibliothek ist als multi-theming-fähige Präsentationsschicht umgesetzt – ohne eigene Fachlogik oder Datenverarbeitung. Damit eignet sie sich für statische Webseiten ebenso wie für dynamische Webanwendungen in unterschiedlichen Corporate Designs.
    documentation: https://public-ui.github.io/docs
    apiDocumentation: https://public-ui.github.io/docs/api/
  en:
    shortDescription: KoliBri – The accessible WebComponent library
    longDescription: >
      HTML is intentionally specified in an open way to ensure durability and robustness. However, this often leads to HTML compositions that are not accessible, semantic, or valid. KoliBri builds directly on W3C web standards, is framework-agnostic, and provides a generic reference implementation of the WCAG and BITV accessibility standards. It is implemented as a multi-theme-capable presentation layer, without business logic or data handling. This makes it suitable for both static websites and dynamic web applications in various corporate designs.
    documentation: https://public-ui.github.io/docs
    apiDocumentation: https://public-ui.github.io/docs/api/

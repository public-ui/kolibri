<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>KoliBri – Logo-Varianten</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: light-dark(#fafafa, #101418);
				--card: light-dark(#ffffff, #1a2027);
				--text: light-dark(#202020, #e8e8e8);
				--muted: light-dark(#5a6570, #9aa7b2);
				--active: light-dark(#003c78, #7db4e8);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1.5rem;
				padding: 2rem;
				background: var(--bg);
				color: var(--text);
				font-family: Verdana, Arial, Calibri, Helvetica, sans-serif;
				font-size: 1rem;
			}
			h1 {
				font-size: 1.25rem;
				margin: 0;
			}
			.preview {
				width: min(60vmin, 420px);
				aspect-ratio: 1;
				background: var(--card);
				border-radius: 1rem;
				display: grid;
				place-items: center;
				padding: 1.5rem;
			}
			.preview img {
				width: 100%;
				height: 100%;
			}
			.switcher {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				justify-content: center;
			}
			.switcher button {
				font: inherit;
				padding: 0.6rem 1rem;
				min-height: 44px;
				border-radius: 0.5rem;
				border: 1px solid var(--muted);
				background: var(--card);
				color: var(--text);
				cursor: pointer;
			}
			.switcher button[aria-pressed='true'] {
				border-color: var(--active);
				box-shadow: inset 0 0 0 2px var(--active);
				font-weight: bold;
			}
			.description {
				max-width: 42rem;
				text-align: center;
				color: var(--muted);
				line-height: 1.5;
				margin: 0;
				min-height: 3em;
			}
		</style>
	</head>
	<body>
		<h1>KoliBri – Logo-Varianten</h1>
		<div class="preview">
			<img id="preview" src="kolibri.logo.svg" alt="KoliBri Logo" width="420" height="420" />
		</div>
		<div class="switcher" role="group" aria-label="Logo-Variante wählen">
			<button type="button" aria-pressed="true" data-src="kolibri.logo.svg" data-text="Klassisch: einfarbig im Markenblau, wie im Repository vorhanden.">
				Klassisch
			</button>
			<button
				type="button"
				aria-pressed="false"
				data-src="kolibri.logo.colorful.svg"
				data-text="Bunt, statisch: sechs Segmente in farblindensicherer Okabe-Ito-Palette mit Markenblau als Anker; Nachbarkontraste per Skript optimiert."
			>
				Bunt (statisch)
			</button>
			<button
				type="button"
				aria-pressed="false"
				data-src="kolibri.logo.colorful.animated.svg"
				data-text="Wechselspiel: 7 Farben, 6 Segmente – jede Sekunde wechselt genau ein Segment auf die gerade ungenutzte Farbe; die freie Farbe wandert im Kreis. 42s-Zyklus, pausiert bei „Bewegung reduzieren“."
			>
				Wechselspiel
			</button>
			<button
				type="button"
				aria-pressed="false"
				data-src="kolibri.logo.gradient.svg"
				data-text="Verlauf: dieselbe Palette fließt ohne Haltphasen kontinuierlich im Kreis um die Form; während der Übergänge entstehen Mischfarben. 14s pro Umlauf, pausiert bei „Bewegung reduzieren“."
			>
				Verlauf
			</button>
		</div>
		<p class="description" id="description">Klassisch: einfarbig im Markenblau, wie im Repository vorhanden.</p>
		<script>
			const preview = document.getElementById('preview');
			const description = document.getElementById('description');
			const buttons = [...document.querySelectorAll('.switcher button')];
			buttons.forEach((button) => {
				button.addEventListener('click', () => {
					preview.src = button.dataset.src;
					description.textContent = button.dataset.text;
					buttons.forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
				});
			});
		</script>
	</body>
</html>
